name: Enrich NHS Jobs

# Calls /api/enrich repeatedly in small batches (10 jobs at a time, fetched in parallel
# by enrich.js) until nothing is left unenriched. Runs after the fetch workflow so
# newly-saved jobs get their band and sponsorship details filled in the same day.
#
# A single failed batch (network hiccup, one slow NHS Jobs page) no longer kills the
# whole run — it logs the failure and tries again on the next loop iteration instead.

on:
  schedule:
    - cron: '0 13 * * *'   # 2pm UK time (BST) — after the 12:30 fetch has had time to finish
    - cron: '0 18 * * *'   # 7pm UK time (BST) — after the 5:30 fetch has had time to finish
  workflow_dispatch: {}

jobs:
  enrich-all:
    runs-on: ubuntu-latest
    steps:
      - name: Enrich in batches until done
        run: |
          FAILS=0
          for i in $(seq 1 400); do
            RESP=$(curl -sf --max-time 15 "${{ secrets.PRISAHUB_URL }}/api/enrich?limit=10" || echo "")
            if [ -z "$RESP" ]; then
              FAILS=$((FAILS + 1))
              echo "[$i] request failed or timed out ($FAILS in a row)"
              if [ "$FAILS" -ge 8 ]; then
                echo "Too many consecutive failures, stopping this run — will retry on the next schedule."
                break
              fi
              sleep 2
              continue
            fi
            FAILS=0
            echo "$RESP" | jq -c . || echo "  (couldn't parse response: $RESP)"
            REMAINING=$(echo "$RESP" | jq -r '.remaining // 0' 2>/dev/null || echo "0")
            if [ "$REMAINING" = "0" ]; then
              echo "All jobs enriched."
              break
            fi
            sleep 1
          done
