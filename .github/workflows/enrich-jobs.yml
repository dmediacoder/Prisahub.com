name: Enrich NHS Jobs

# Calls /api/enrich repeatedly in small batches (15 jobs at a time) until nothing is
# left unenriched. Scheduled about 1.5-2 hours after each fetch run so newly-saved jobs
# get their band and sponsorship details filled the same day.
#
# Same UTC/BST note as fetch-jobs.yml — subtract 1 hour from each cron line once the UK
# switches to GMT in late October.

on:
  schedule:
    - cron: '0 13 * * *'   # 2pm UK time (BST) — after the 12:30 fetch has had time to finish
    - cron: '0 18 * * *'   # 7pm UK time (BST) — after the 5:30 fetch has had time to finish
  workflow_dispatch: {}

jobs:
  enrich-all:
    runs-on: ubuntu-latest
    steps:
      - name: Enrich in batches until done
        run: |
          for i in $(seq 1 200); do
            RESP=$(curl -sf "${{ secrets.PRISAHUB_URL }}/api/enrich?limit=15")
            echo "$RESP" | jq -c .
            REMAINING=$(echo "$RESP" | jq -r '.remaining // 0')
            if [ "$REMAINING" = "0" ]; then
              echo "All jobs enriched."
              break
            fi
            sleep 1
          done
